
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: terminal-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - API_PORT=${API_PORT:-8000}
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/terminal.db}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./apps/api/app:/app/app:ro
    networks:
      - terminal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-builder}
    container_name: terminal-web
    ports:
      - "${WEB_PORT:-3005}:3005"
    environment:
      - NEXT_PUBLIC_API_BASE=http://api:8000
      - NEXT_PUBLIC_WS_BASE=ws://api:8000
      - PORT=3005
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: ${WEB_COMMAND:-npm run dev}
    networks:
      - terminal-network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  neo4j:
    image: neo4j:5-community
    container_name: terminal-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - terminal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  terminal-network:
    driver: bridge

volumes:
  api-data:
    driver: local
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: